exp_name: method1_ffhq_clean_full_long_single_image_patch
seed: 42

eval:
  hair_leak_check: false
  sanity_compare: false
  debug_hair_masks: false
  enabled: true
  # Less frequent eval for long runs on the full dataset.
  every_steps: 500
  seed: 123
  num_inference_steps: 25

data:
  train_dir: /path/to/images
  val_dir: /path/to/images
  # Identity-disjoint single-image self-reconstruction protocol.
  train_pairs_csv: data/ffhq_identity_split_single_image/train_pairs.csv
  val_pairs_csv: data/ffhq_identity_split_single_image/val_pairs.csv
  image_size: 512

models:
  sd_model_id: runwayml/stable-diffusion-v1-5
  arc2face_repo_id: FoivosPar/Arc2Face
  clip_vision_id: openai/clip-vit-large-patch14
  hair_parsing_weights: /path/to/79999_iter.pth
  insightface_root: /path/to/insightface
  insightface_device: cuda

cond:
  n_tokens: 4
  scale_hair: 0.65
  hair_bg_value: 0.0
  hair_class: 17
  hair_classes: [17]
  hair_mask_dilate_kernel: 1
  hair_mask_dilate_iters: 1
  hair_focus_crop: false
  hair_focus_crop_margin: 0.20
  hair_focus_crop_square: true
  hair_token_mode: patch
  hair_patch_mask_threshold: 0.05
  hair_max_patch_tokens: 64
  hair_patch_post_layernorm: true
  hair_patch_binary_mask: true
  hair_apply_token_mask_to_values: false
  hair_token_normalization: layernorm
  hair_spatial_gate: true
  hair_kv_init: text

train:
  only_both_face: true
  cache_arcface_embs: true
  arcface_cache_max_items: 50000
  profile_timing: false
  profile_sync_cuda: false
  profile_every: 100
  debug_conditioning_every: 0

  batch_size: 2
  lr: 7e-5
  dual_lr_mult: 1.5

  hair_aux_weight: 0.45
  hair_localization_weight: 0.10
  hair_loss_inside_weight: 1.0
  hair_loss_outside_weight: 0.05
  cross_hair_clip_weight: 0.15
  cross_hair_contrast_weight: 0.20
  cross_hair_margin: 0.1
  cross_hair_clip_every: 2
  cross_hair_clip_batch: 2
  cross_hair_decode_size: 256
  cross_min_hair_coverage: 0.02
  # Classifier-free guidance training with independent condition dropout:
  # one coin for identity/text conditioning, one coin for hair conditioning.
  id_cond_drop_prob: 0.15
  hair_cond_drop_prob: 0.15

  weight_decay: 0.0
  max_steps: 10000
  log_every: 25
  # Less frequent checkpoints to reduce IO pressure.
  save_every: 1000
  mixed_precision: fp16
  run_sanity_check: true

infer:
  steps: 25
